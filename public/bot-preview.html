<!doctype html><html><head><meta charset="utf-8"><title>Tulai preview</title><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="robot" width="360" height="360"></canvas><script>addEventListener('message',(e)=>{const m=e.data||{};if(m.skin&&window.botScene)window.botScene.setSkin(m.skin);else if(m.skin)window.__pendingSkin=m.skin;if(m.move&&window.botScene)window.botScene.perform(m.move);if(m.state&&window.botScene)window.botScene.setState(m.state)})</script><script type="module" src="/bot-robot.js"></script></body></html>
