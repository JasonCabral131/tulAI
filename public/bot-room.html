<!doctype html><html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font:12px system-ui;color:#eef3fa;background:transparent}header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#171c28ed;border-radius:14px;-webkit-app-region:drag}button{background:#303749;color:white;border:0;border-radius:8px;padding:5px 12px;-webkit-app-region:no-drag;cursor:pointer}main{display:grid;grid-template-columns:repeat(4,1fr)}article{position:relative;height:200px;text-align:center;-webkit-app-region:drag}iframe{border:0;width:100%;height:155px;pointer-events:none;color-scheme:normal}b,small{display:block;background:#161c29dc;width:max-content;max-width:100%;margin:auto;border-radius:8px;padding:2px 8px}small{color:#a8b6cc;font-size:10px}.active b{color:#94ffe0;box-shadow:0 0 16px #50dda466}</style><header><span>Tulai team · taking turns</span><button id="hide">Hide & stop</button></header><main></main><script>
const names=['Planner','Builder','Reviewer','Analyst','Coordinator','Tester','Editor','Auditor'];let count=0;
window.setRoom=({count:n,skin})=>{count=n;const root=document.querySelector('main');root.style.gridTemplateColumns=`repeat(${Math.min(n,4)},1fr)`;root.replaceChildren();for(let i=0;i<n;i++){const a=document.createElement('article'),f=document.createElement('iframe'),b=document.createElement('b'),s=document.createElement('small');f.src='/bot-preview.html?thumbnail=1&skin='+encodeURIComponent(JSON.stringify({...skin,craft:skin?.craft&&skin.craft!=='none'?skin.craft:'spacecraft'}));b.textContent=(n===2?['Builder','Reviewer']:names)[i];s.textContent='Listening';a.append(f,b,s);root.append(a)}};
window.roomEvent=e=>document.querySelectorAll('article').forEach((a,i)=>{const active=e.type==='answer'&&i===e.index;a.classList.toggle('active',active);a.querySelector('small').textContent=active?(e.speaking?'Speaking':'Contributing'):'Listening';if(active){a.querySelector('b').textContent=e.label;a.title=e.text}a.querySelector('iframe').contentWindow.postMessage({state:active?(e.speaking?'speaking':'thinking'):'listening'},'*')});
document.getElementById('hide').onclick=()=>fetch('/api/bot/team/room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visible:false})});
</script></html>
